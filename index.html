<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08090B" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Manrope:wght@400..800&display=swap">
<style>
/* Layout: phone-first single column on a cool grey page. A midnight "card" hero (like the physical card in
   your wallet) holds the cap gauge; white grouped lists follow; a floating pill tab bar sits above the home bar. */
:root {
  --hero-a: #171C27; --hero-b: #222937; --on-hero: #F4F6FA; --on-hero-2: rgba(226,231,240,.62);
  --glass: rgba(255,255,255,.05); --glass-line: rgba(255,255,255,.10); --mint: #C9D4E8;
  --sheet: #F3F3F1; --card: #FFFFFF; --ink: #171B22; --ink-2: #6B7079; --line: #E8E7E3; --fill: #F4F4F1;
  --accent: #2F4B85; --accent-ink: #FFFFFF;
  --ok: #3E7D55; --warn: #9A6B1F; --bad: #B4553A;
  --c0: #4F7A5A; --c1: #4A6694; --c2: #B0603F; --c3: #7A5C8E; --c4: #A07A2C; --c5: #A3546E; --c6: #3F7C85; --c7: #6B7A3A; --c8: #7A7F88;
  --shadow: 0 1px 2px rgba(23,27,34,.05);
  --ring: 0 0 0 1px rgba(23,27,34,.06);
  --edge: inset 0 0 0 1px rgba(23,27,34,.05);
  --font: "Manrope", ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
  --display: "Bricolage Grotesque", "Manrope", ui-sans-serif, -apple-system, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --hero-a: #1A1F29; --hero-b: #232A36;
  --sheet: #08090B; --card: #1A1D24; --ink: #ECEDEF; --ink-2: #959AA4; --line: #2F343E; --fill: #252932;
  --accent: #A9BCE6; --accent-ink: #12161E; --ok: #7FC497; --warn: #D7B064; --bad: #E39A80;
  --c0: #8DB89A; --c1: #93A9D1; --c2: #D89A7C; --c3: #B49CC6; --c4: #D2B26E; --c5: #D597AC; --c6: #86B7BE; --c7: #AEBB7E; --c8: #9AA0AA;
  --shadow: none; --ring: 0 0 0 1px rgba(255,255,255,.08); --edge: inset 0 0 0 1px rgba(255,255,255,.09); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --hero-a: #1A1F29; --hero-b: #232A36;
  --sheet: #08090B; --card: #1A1D24; --ink: #ECEDEF; --ink-2: #959AA4; --line: #2F343E; --fill: #252932;
  --accent: #A9BCE6; --accent-ink: #12161E; --ok: #7FC497; --warn: #D7B064; --bad: #E39A80;
  --c0: #8DB89A; --c1: #93A9D1; --c2: #D89A7C; --c3: #B49CC6; --c4: #D2B26E; --c5: #D597AC; --c6: #86B7BE; --c7: #AEBB7E; --c8: #9AA0AA;
  --shadow: none; --ring: 0 0 0 1px rgba(255,255,255,.08); --edge: inset 0 0 0 1px rgba(255,255,255,.09); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--sheet); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar + hero card */
.top .wrap { padding-block: 10px 0; display: grid; gap: 12px; }
.topbar { display: flex; align-items: center; gap: 8px; min-width: 0; }
.month { display: flex; align-items: center; gap: 2px; min-width: 0; }
.month h1 { font-family: var(--display); font-size: 20px; font-weight: 700; letter-spacing: -.02em; margin: 0; padding: 0 4px; white-space: nowrap; }
.ptitle { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -.03em; }
.navbtn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.navbtn:active, .navbtn[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--ring); }
.tright { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.donebtn { border: 0; background: var(--ink); color: var(--card); border-radius: 8px; padding: 0 16px; min-height: 36px; font-weight: 800; font-size: 14px; }
.pill { font-size: 11.5px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--card); color: var(--ink-2); box-shadow: var(--ring); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.pill[data-state="off"]::before { background: var(--warn); }
.hero { position: relative; overflow: hidden; border-radius: 20px; padding: 20px 18px 16px; color: var(--on-hero);
  background: linear-gradient(165deg, var(--hero-b), var(--hero-a)); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.hero::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.hgroup { display: grid; gap: 14px; position: relative; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--on-hero-2); }
.big { font-family: var(--display); font-size: clamp(40px, 12vw, 52px); font-weight: 700; letter-spacing: -.035em; line-height: 1; }
.big.over { color: #E8A58E; }
.gauge { position: relative; width: 100%; max-width: 300px; margin: 0 auto; }
.gauge svg { width: 100%; height: auto; display: block; overflow: visible; }
.g-track { fill: none; stroke: rgba(255,255,255,.10); stroke-width: 10; stroke-linecap: butt; }
.g-fill { fill: none; stroke: #E6EAF1; stroke-width: 10; stroke-linecap: butt; transition: stroke-dasharray .5s ease; }
.g-fill.over { stroke: #D98B72; }
.g-tick { stroke: #F4F6FA; stroke-width: 2; stroke-linecap: butt; opacity: .7; }
@media (prefers-reduced-motion: reduce) { html:not(.motion-on) .g-fill { transition: none; } }
.gauge-in { position: absolute; left: 0; right: 0; bottom: 2px; display: grid; justify-items: center; gap: 6px; text-align: center; }
.gsub { font-size: 13px; color: var(--on-hero-2); }
.gsub strong { color: var(--on-hero); font-weight: 700; }
.daily { text-align: center; font-size: 13px; color: var(--on-hero-2); min-height: 1.2em; margin-top: -4px; }
.daily strong { color: var(--on-hero); font-weight: 800; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--glass-line); padding-top: 12px; }
.stat { min-width: 0; padding: 0 6px; text-align: center; }
.stat + .stat { border-left: 1px solid var(--glass-line); }
.stat span { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--on-hero-2); }
.stat strong { font-size: 16px; font-weight: 800; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.glass { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 18px; padding: 14px; display: grid; gap: 10px; }
.glass .row { display: flex; justify-content: space-between; gap: 6px 14px; font-size: 13px; color: var(--on-hero-2); flex-wrap: wrap; }
.glass .row strong { color: var(--on-hero); font-weight: 700; }
.stackbar { height: 8px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; display: flex; gap: 2px; }
.stackbar i { display: block; height: 100%; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

/* Page */
.sheet .wrap { padding-block: 18px calc(118px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 22px; }
.sec { display: grid; gap: 10px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 0 4px; }
.sec-h h2 { margin: 0; font-family: var(--display); font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.link { background: none; border: 0; color: var(--accent); font-weight: 700; font-size: 14px; padding: 6px 0; }
.card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow), var(--ring); }
.list { display: grid; overflow: hidden; }
.list > * + * { box-shadow: inset 0 1px 0 var(--line); }
.notice { font-size: 13px; color: var(--ink-2); background: var(--card); border-radius: 12px; padding: 12px 14px; box-shadow: var(--ring); }
.tint { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none;
  color: var(--t); background: color-mix(in srgb, var(--t) 11%, var(--card)); grid-row: span 2; }
.tap { border: 0; background: none; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; transition: background .12s; }
.tap:active { background: var(--fill); }

.cat { display: grid; grid-template-columns: 40px 1fr auto auto; gap: 2px 12px; align-items: center; padding: 13px 16px; }
.cat .name { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat .sub { font-size: 12.5px; color: var(--ink-2); }
.cat .bar { grid-column: 2 / 5; height: 3px; border-radius: 0; background: var(--fill); overflow: hidden; margin-top: 6px; }
.cat .bar i { display: block; height: 100%; background: var(--t); }
.cat .bar.over i { background: var(--bad); }
.catamt { justify-self: end; font-weight: 800; grid-column: 3; }
.cat .chev { color: var(--ink-2); font-size: 20px; line-height: 1; grid-column: 4; grid-row: 1 / 3; opacity: .6; }
.cat .sub { grid-column: 2 / 4; }

.tx { display: grid; grid-template-columns: 40px 1fr auto; gap: 0 12px; align-items: center; padding: 12px 16px; min-height: 64px; }
.tx .name { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .sub { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tx .amt { font-weight: 800; text-align: right; display: grid; justify-items: end; gap: 2px; }
.tx .amt.in { color: var(--ok); }
.tag { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 6px; background: var(--fill); color: var(--ink-2); }
.del { border: 0; background: none; color: var(--ink-2); font-size: 12px; font-weight: 700; padding: 2px 0; }
.del.armed { color: var(--bad); }
.day-h { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: var(--ink-2); padding: 6px 4px 0; letter-spacing: .06em; text-transform: uppercase; }
.cb { font-size: 11.5px; font-weight: 700; color: var(--ok); }

.empty { padding: 22px 18px; display: grid; gap: 12px; text-align: left; }
.empty p { margin: 0; color: var(--ink-2); max-width: 46ch; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { min-height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: var(--fill); font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.chip { font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 999px; white-space: nowrap; justify-self: end; }
.chip.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.chip.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.chip.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, transparent); }

/* Reminders */
.remind-list .rrow { display: grid; grid-template-columns: 40px 1fr auto; gap: 0 12px; align-items: center; padding: 12px 14px 12px 16px; }
.rrow .tint { grid-row: auto; }
.rrow strong { display: block; font-size: 14px; }
.rrow .sub { display: block; font-size: 12.5px; color: var(--ink-2); }
.mini { min-height: 34px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 13px; white-space: nowrap; }
.mini.ghost { background: var(--fill); color: var(--ink); }

/* Category detail */
.backbtn { border: 0; background: none; color: var(--accent); font-weight: 800; font-size: 15px; padding: 6px 4px; justify-self: start; min-height: 40px; }
.cathead { padding: 18px; display: grid; gap: 10px; }
.cathead .big2 { font-family: var(--display); font-size: 38px; font-weight: 700; letter-spacing: -.03em; line-height: 1.05; }
.cathead .bar { height: 4px; border-radius: 0; background: var(--fill); overflow: hidden; }
.cathead .bar i { display: block; height: 100%; background: var(--t); }
.cathead .bar.over i { background: var(--bad); }
.cathead .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--ink-2); font-size: 13.5px; }

/* Trends */
.chart { padding: 16px 12px 10px; }
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); padding: 0 6px 6px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; background: var(--accent); }
.legend i.pace { background: none; border-top: 2px dashed var(--ink-2); height: 0; }
.share { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 13px 16px; align-items: center; }
.share .bar { grid-column: 1 / 3; height: 4px; border-radius: 0; background: var(--fill); overflow: hidden; }
.share .bar i { display: block; height: 100%; background: var(--t); }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { padding: 16px; display: grid; gap: 2px; }
.kpi span { font-size: 12px; color: var(--ink-2); font-weight: 700; }
.kpi strong { font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
.kpi small { font-size: 12px; color: var(--ink-2); }
.cbrow { display: grid; grid-template-columns: 40px 1fr auto; gap: 0 12px; align-items: center; padding: 12px 16px; }
.cbrow .tint { grid-row: auto; }
.cbrow .name { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cbrow .sub { font-size: 12.5px; color: var(--ink-2); }

/* Budget editor */
.capcard { padding: 18px; display: grid; gap: 10px; }
.capcard p { margin: 0; color: var(--ink-2); font-size: 13.5px; max-width: 52ch; }
.big-field { font-family: var(--display); font-size: 28px; font-weight: 700; min-height: 56px; text-align: left !important; }
.capcard .money-in::before { font-size: 22px; font-weight: 700; }
.edit { display: grid; grid-template-columns: 40px 1fr 104px auto; gap: 10px; align-items: center; padding: 10px 12px 10px 16px; }
.edit .tint { grid-row: auto; }
.edit.edit2 { grid-template-columns: 40px 1fr auto; }
.field { min-height: 44px; border-radius: 10px; border: 1px solid transparent; background: var(--fill); padding: 0 12px; font-size: 16px; width: 100%; min-width: 0; }
.field:focus { border-color: var(--accent); outline: none; background: var(--card); }
.money-in { position: relative; }
.money-in::before { content: "$"; position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-2); font-size: 15px; pointer-events: none; }
.money-in .field { padding-left: 24px; text-align: right; }
.x { width: 36px; height: 36px; border-radius: 50%; border: 0; background: none; color: var(--ink-2); font-size: 20px; line-height: 1; }
.x.armed { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); font-size: 12px; font-weight: 800; width: auto; padding: 0 10px; border-radius: 999px; }
.addcat { display: grid; grid-template-columns: 1fr 104px auto; gap: 10px; padding: 12px 12px 12px 16px; }
.addcat.addcat2 { grid-template-columns: 1fr auto; }
.cardedit summary { list-style: none; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; padding: 12px 14px 12px 16px; cursor: pointer; align-items: center; }
.cardedit summary::-webkit-details-marker { display: none; }
.cardedit .sub { font-size: 12.5px; color: var(--ink-2); }
.rates { display: grid; grid-template-columns: 1fr 96px; gap: 8px 12px; padding: 0 16px 14px; align-items: center; font-size: 14px; }
.pct-in { position: relative; }
.pct-in::after { content: "%"; position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-2); font-size: 15px; pointer-events: none; }
.pct-in .field { padding-right: 28px; text-align: right; }
.rot { margin: 0 16px 16px; padding: 14px; border-radius: 16px; background: var(--fill); display: grid; gap: 10px; }
.rot-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
.rot .sub { font-size: 12.5px; color: var(--ink-2); }
.rot .cchip { background: var(--card); }
.switch { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; font-weight: 700; font-size: 14px; padding: 4px 0; min-height: 36px; }
.switch i { width: 46px; height: 28px; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.switch[aria-checked="true"] i { background: var(--ok); }
.switch[aria-checked="true"] i::after { transform: translateX(18px); }
.capbar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.capbar i { display: block; height: 100%; background: var(--t); }

/* Accounts */
.acct-h { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; min-height: 66px; }
.acct-h .name { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct-h .sub { display: block; font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct-h .amt { display: grid; justify-items: end; gap: 2px; font-weight: 800; }
.acct-h .tint { grid-row: auto; }
.addbal { color: var(--accent); font-size: 14px; }
.delta { font-size: 12px; font-weight: 800; }
.delta.up { color: var(--ok); } .delta.down { color: var(--bad); }
.acct-b { padding: 0 16px 18px; display: grid; gap: 14px; }
.balform { display: grid; gap: 6px; }
.balrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.balrow .field, .balrow3 .field { font-size: 18px; font-weight: 800; }
.balrow3 { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; }
.hist { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 13.5px; color: var(--ink-2); }
.hist strong { color: var(--ink); font-weight: 700; }
.acct-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.acct-meta .btn, .acct-meta .wide { grid-column: 1 / -1; }
.addcat.addacct { grid-template-columns: 1fr 120px auto; }
.inv-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.inv-stats div { background: var(--fill); border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.inv-stats span { font-size: 11px; font-weight: 800; color: var(--ink-2); letter-spacing: .06em; text-transform: uppercase; }
.inv-stats strong { font-size: 15px; overflow-wrap: anywhere; }
.inv-stats .pos { color: var(--ok); } .inv-stats .neg { color: var(--bad); }
.hintp { font-size: 12.5px; color: var(--ink-2); }
.spark svg { width: 100%; height: auto; display: block; }
.cbbox { background: var(--fill); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.cbbox .field { background: var(--card); }
.due-soon { color: var(--bad); font-weight: 800; }
.sec-tools { display: inline-flex; align-items: center; gap: 10px; }
.sec-tools .donebtn { min-height: 32px; padding: 0 14px; }
.sortrow { display: grid; grid-template-columns: 38px 1fr 36px 36px 40px; gap: 6px; align-items: center; padding: 10px 8px 10px 16px; background: var(--card); min-height: 60px; }
.sortrow .tint { grid-row: auto; }
.sortrow .name { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mv { width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--fill); color: var(--ink); display: grid; place-items: center; }
.mv:disabled { opacity: .3; }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const DEFAULT_CATS = [
  { id: "groceries", name: "Groceries", t: 0 },
  { id: "dining", name: "Dining out", t: 2 },
  { id: "transport", name: "Transport", t: 6 },
  { id: "utilities", name: "Bills & subscriptions", t: 4 },
  { id: "home", name: "Home", t: 1 },
  { id: "shopping", name: "Shopping", t: 3 },
  { id: "health", name: "Health & care", t: 7 },
  { id: "fun", name: "Fun", t: 5 },
  { id: "other", name: "Other", t: 8 },
];
// Cashback rates in percent. `rotating` holds a card's quarterly
// 5% categories, which pay only once activated and only on the first $1,500 each quarter.
const DEFAULT_CARDS = [
  { id: "everyday", name: "Everyday card", base: 1.5, rates: {}, t: 6 },
  { id: "dining", name: "Dining card", base: 1, rates: { dining: 3, groceries: 3, fun: 3 }, t: 2 },
  { id: "rotating", name: "Rotating 5% card", base: 1, rates: {}, t: 1,
    rotating: { quarter: quarterOf(todayISO()), cats: ["groceries", "dining"], activated: false, rate: 5, cap: 1500 } },
];
const DEFAULT_CAP = 950;
const DEFAULT_TAGS = [{ id: "amazon", name: "Amazon" }];
const S = { ccSince: null, ccOrder: null, cardAccts: null, tags: null, cap: null, cats: null, cards: null, txs: [], month: ym(new Date()), tab: "home", mode: "loading", armed: null, draft: null, stale: false };
let store = null;

/* ---------- helpers ---------- */
function ym(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function todayISO() { const d = new Date(); return ym(d) + "-" + String(d.getDate()).padStart(2, "0"); }
function shiftMonth(m, n) { const [y, mo] = m.split("-").map(Number); return ym(new Date(y, mo - 1 + n, 1)); }
function monthInfo(m) {
  const [y, mo] = m.split("-").map(Number);
  const days = new Date(y, mo, 0).getDate();
  const label = new Date(y, mo - 1, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
  const cur = ym(new Date());
  const rel = m === cur ? 0 : m < cur ? -1 : 1;
  const today = new Date().getDate();
  return { y, mo, days, label, rel, lastDay: rel === 0 ? today : rel < 0 ? days : 0, daysLeft: rel === 0 ? days - today + 1 : rel > 0 ? days : 0 };
}
function money(n, dp) {
  const abs = Math.abs(n), d = dp ?? (abs % 1 && abs < 1000 ? 2 : 0);
  return (n < 0 ? "−" : "") + "$" + abs.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function rid() { return Math.random().toString(36).slice(2, 10); }
function cats() { return S.cats || DEFAULT_CATS; }
function catOf(id) { return cats().find(c => c.id === id) || { id, name: "Other", limit: 0, t: 3 }; }
function tags() { return S.tags || DEFAULT_TAGS; }
function tagOf(id) { return tags().find(g => g.id === id) || { id, name: "Removed tag" }; }
function cards() { return S.cards || DEFAULT_CARDS; }
function cardOf(id) { return cards().find(c => c.id === id) || { id, name: "Removed card", base: 0, rates: {}, t: 7 }; }
function quarterOf(iso) { const [y, m] = iso.split("-").map(Number); return y + "-Q" + (Math.floor((m - 1) / 3) + 1); }
function quarterEnd(q) { const [y, n] = q.split("-Q").map(Number); return new Date(y, n * 3, 0); }
function quarterLabel(q) { return q.replace(/^(\d+)-(Q\d)$/, "$2 $1"); }
// Spending on this card that already earned the rotating bonus this quarter (counts toward the cap).
function rotUsed(card, q) { return S.txs.filter(t => t.card === card.id && t.rotating && quarterOf(t.date) === q).reduce((a, t) => a + t.amount, 0); }
function rotLive(card, catId, iso) { const r = card.rotating; return !!r && (r.cats || []).includes(catId) && r.quarter === quarterOf(iso || todayISO()); }
function rotBonus(card, catId, iso) {
  const r = card.rotating;
  if (!rotLive(card, catId, iso) || !r.activated) return 0;
  return rotUsed(card, r.quarter) < (r.cap || 1500) ? (r.rate || 5) : 0;
}
function rateFor(card, catId, iso, tags = []) {
  const r = card.rates?.[catId], tagRate = Math.max(0, ...tags.map(g => +(card.rates?.[g] ?? 0) || 0));
  return Math.max(rotBonus(card, catId, iso), tagRate, +(r ?? card.base) || 0);
}
function bestCard(catId, iso, tags = []) {
  let best = null;
  for (const c of cards()) { const r = rateFor(c, catId, iso, tags); if (!best || r > best.rate) best = { card: c, rate: r }; }
  return best;
}
// A card that would beat the best rate if its rotating categories were activated.
function unactivatedBetter(catId, iso, tags = []) {
  const best = bestCard(catId, iso, tags);
  return cards().find(c => rotLive(c, catId, iso) && !c.rotating.activated && (c.rotating.rate || 5) > (best?.rate || 0));
}
function catNames(ids) { return ids.map(id => catOf(id).name).join(", ") || "none picked"; }
function pct(r) { return (+r).toLocaleString("en-US", { maximumFractionDigits: 2 }) + "%"; }
function tvar(c) { return `--t: var(--c${(c.t ?? 0) % 9})`; }
function niceDate(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }); }

function derive(m = S.month) {
  const txs = S.txs.filter(t => (t.date || "").startsWith(m));
  const by = {}, byCard = {}, byTag = {}; let spent = 0, income = 0, cash = 0, missed = 0;
  for (const t of txs) {
    if (t.kind === "income") { income += t.amount; continue; }
    spent += t.amount; by[t.cat] = (by[t.cat] || 0) + t.amount;
    for (const g of t.tags || []) byTag[g] = (byTag[g] || 0) + t.amount;
    if (t.card) {
      cash += t.cb || 0;
      const bc = (byCard[t.card] ||= { spent: 0, cb: 0 }); bc.spent += t.amount; bc.cb += t.cb || 0;
      const best = bestCard(t.cat, t.date, t.tags || []);
      if (best && best.rate > (t.rate || 0)) missed += t.amount * (best.rate - (t.rate || 0)) / 100;
    }
  }
  const budget = monthlyCap(m);
  return { txs, by, byCard, byTag, spent, income, cash, missed, budget, left: budget - spent };
}
// The usual cap, unless a month has its own cap set in Settings.
function capEdit() { return S.capEdit || S.month; }
// Months offered in the cap picker: 6 back through 6 ahead of this month, plus any that already have a cap.
function capMonths() {
  const cur = ym(new Date()), set = new Set(Object.keys(S.capByMonth || {}));
  for (let i = -6; i <= 6; i++) set.add(shiftMonth(cur, i));
  set.add(S.month); return [...set].sort();
}
function usualCap() { return typeof S.cap === "number" ? S.cap : DEFAULT_CAP; }
function monthlyCap(m = S.month) { const o = (S.capByMonth || {})[m]; return typeof o === "number" ? o : usualCap(); }

/* ---------- icons ---------- */
const ICONS = {
  groceries: '<path d="M3 4h2l2.3 10.5h10.4L20 7H6"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>',
  dining: '<path d="M7 3v7M5 3v4.5a2 2 0 0 0 4 0V3M7 10.5V21M17 21V3c-2.4 1.5-3.2 4.3-3.2 7.5H17"/>',
  transport: '<path d="M5 16.5V12l1.8-4.6A2 2 0 0 1 8.7 6h6.6a2 2 0 0 1 1.9 1.4L19 12v4.5M5 16.5h14M6.5 16.5v2M17.5 16.5v2M5 12h14"/>',
  utilities: '<path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2zM9.5 8.5h5M9.5 12h5M9.5 15.5h3"/>',
  home: '<path d="M3.5 10.5 12 3.5l8.5 7V20.5h-17z"/><path d="M10 20.5v-5h4v5"/>',
  shopping: '<path d="M5 8h14l-1.2 12.5H6.2zM9 8V6.5a3 3 0 0 1 6 0V8"/>',
  health: '<path d="M12 20s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 7.6 4.2 4.2 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>',
  tag: '<path d="M3.5 12.2V4.5h7.7l9 9-7.7 7.7z"/><circle cx="8" cy="9" r="1.2"/>',
  fun: '<path d="m12 3.5 2.5 5.3 5.8.7-4.3 4 1.2 5.7L12 16.3l-5.2 2.9L8 13.5l-4.3-4 5.8-.7z"/>',
  accessories: '<path d="M5 8h14l-1.2 12.5H6.2zM9 8V6.5a3 3 0 0 1 6 0V8"/>',
  amazon: '<path d="M3.5 7.5 12 3.5l8.5 4v9L12 20.5l-8.5-4zM3.5 7.5 12 11.5l8.5-4M12 11.5v9"/>',
  other: '<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>',
  rent: '<path d="M3.5 10.5 12 3.5l8.5 7V20.5h-17z"/><path d="M10 20.5v-5h4v5"/>',
  savings: '<circle cx="12" cy="12" r="8.5"/><path d="M14.5 9.5c-.4-.8-1.3-1.3-2.5-1.3-1.5 0-2.5.8-2.5 1.9 0 2.6 5 1.4 5 4 0 1.1-1 1.9-2.5 1.9-1.2 0-2.2-.5-2.6-1.4M12 6.8v1.4M12 15.9v1.3"/>',
  income: '<path d="M17 7 7 17M7 9.5V17h7.5"/>',
  card: '<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h3"/>',
  bank: '<path d="M3 9.5 12 4l9 5.5M5 10.5v7M9.5 10.5v7M14.5 10.5v7M19 10.5v7M3 20.5h18"/>',
  invest: '<path d="M3.5 17 9 11.5l4 4 7.5-7.5M15 8h5.5v5.5"/>',
  bolt: '<path d="M13 3 5 14h6l-1 7 8-11h-6z"/>',
  up: '<path d="M6 14l6-6 6 6"/>',
  down: '<path d="M6 10l6 6 6-6"/>',
  grip: '<path d="M5 8h14M5 12h14M5 16h14"/>',
  note: '<path d="M5 4h14v16H5zM8.5 9h7M8.5 12.5h7M8.5 16h4"/>',
  search: '<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
};
function svgIcon(key, size = 18) { return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">${ICONS[key]}</svg>`; }
// Categories use their id's icon; cards and accounts use a shared icon; anything else falls back to its first letter.
function glyph(o) {
  const key = o.base !== undefined ? "card" : o.type ? (atype(o).group === "Investments" ? "invest" : "bank") : String(o.id).startsWith("tag:") ? "tag" : o.id;
  return ICONS[key] ? svgIcon(key) : esc(((o.name || "?").trim()[0]) || "?").toUpperCase();
}
// Budget bar: fills with the month's spending; the tick marks where an even pace would be today.
function drawGauge(d, mi) {
  const frac = d.budget ? Math.min(1, d.spent / d.budget) : 0, fill = document.getElementById("budFill"), pace = document.getElementById("budPace");
  fill.style.width = (frac * 100).toFixed(2) + "%"; fill.classList.toggle("over", d.left < 0);
  pace.hidden = mi.rel !== 0; pace.style.left = (mi.lastDay / mi.days * 100).toFixed(2) + "%";
}

/* ---------- render ---------- */
function render() {
  document.documentElement.classList.toggle("motion-on", motionOn());
  const hadFocus = document.activeElement?.id === "searchBox", caret = hadFocus ? document.activeElement.selectionStart : null;
  const mi = monthInfo(S.month), d = derive();
  document.getElementById("monthLabel").textContent = mi.label;
  const pill = document.getElementById("syncPill");
  pill.textContent = S.mode === "live" ? (S.stale ? "Offline" : "Synced") : S.mode === "preview" ? "Preview" : "Loading";
  pill.dataset.state = S.mode === "live" && !S.stale ? "on" : "off";

  const over = d.left < 0;
  document.getElementById("heroLabel").textContent = mi.rel < 0 ? (over ? "Overspent by" : "Saved in " + mi.label.split(" ")[0]) : over ? "Over budget by" : "Left in budget";
  // Main number: spendable bank cash (set-aside accounts excluded) minus what's owed on cards, right now.
  const gt = groupTotals(), hasBank = accts().some(a => groupOf(a) === "Cash" && bal(a) != null);
  const cashNow = gt.Cash || 0, owedNow = owedTotal(), afterNow = cashNow - owedNow;
  document.getElementById("nowBal").innerHTML = `<div class="eyebrow">Can spend after card bills</div>` + (hasBank
    ? `<div class="big${afterNow < 0 ? " over" : ""}">${money(afterNow, 2)}</div><div class="gsub">Cash <strong>${money(cashNow, 2)}</strong> − cards <strong>${money(owedNow, 2)}</strong></div>`
    : `<div class="gsub">Add your bank balances on the Accounts tab to see this.</div>`);
  const big = document.getElementById("heroBig");
  big.textContent = money(Math.abs(d.left), 0); big.classList.toggle("over", over);
  drawGauge(d, mi);
  document.getElementById("heroSpent").textContent = money(d.spent, 0);
  document.getElementById("heroBudget").textContent = money(d.budget, 0);
  document.getElementById("stIncome").textContent = money(d.income, 0);
  document.getElementById("stSpent").textContent = money(d.spent, 0);
  document.getElementById("stCash").textContent = money(d.cash, 2);

  document.querySelectorAll(".tab").forEach(b => b.dataset.tab === S.tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  const view = document.getElementById("view");
  view.innerHTML = S.mode === "loading" && !S.cats ? `<div class="notice">Loading your budget…</div>` : S.tab === "home" && S.catView ? vCategory(d, mi)
    : ({ home: vHome, activity: vActivity, trends: vTrends, budget: vBudget, accounts: vAccounts })[S.tab](d, mi);
  const onAcct = S.tab === "accounts", onSet = S.tab === "budget", title = document.getElementById("pageTitle");
  document.getElementById("hAcct").hidden = !onAcct;
  document.getElementById("hBudget").hidden = onAcct;
  const onAct = S.tab === "activity", slim = document.getElementById("slimSum");
  document.getElementById("heroCard").hidden = onSet || onAct;
  slim.hidden = !onAct;
  if (onAct) slim.innerHTML = `<span>${d.left < 0 ? (mi.rel < 0 ? "Overspent" : "Over budget") : mi.rel < 0 ? "Saved" : "Left in budget"}</span><strong class="${d.left < 0 ? "neg" : ""}">${money(Math.abs(d.left), 0)}</strong><span class="slim-sub">Spent ${money(d.spent, 0)} of ${money(d.budget, 0)}</span><span class="slim-bar"><i style="width:${d.budget ? Math.min(100, d.spent / d.budget * 100) : 0}%"></i></span>`;
  document.getElementById("monthNav").hidden = onAcct || onSet;
  title.hidden = !(onAcct || onSet); title.textContent = onSet ? "Settings" : "Accounts";
  document.getElementById("setBtn").hidden = onSet;
  document.getElementById("doneBtn").hidden = !onSet;
  if (onAcct) renderAcctHero();
  if (hadFocus) { const sb = document.getElementById("searchBox"); if (sb) { sb.focus(); try { sb.setSelectionRange(caret, caret); } catch {} } }
}

function banner() {
  let out = "";
  if (S.mode === "preview") out += `<div class="notice">Preview with example numbers. <button class="link" data-act="signin">Sign in</button> to use your own.</div>`;
  if (S.stale) out += `<div class="notice">Can't reach your saved budget right now. What you see may be out of date.</div>`;
  return out;
}

function catRow(c, spent, total) {
  const share = total ? spent / total * 100 : 0;
  return `<button class="cat tap" style="${tvar(c)}" data-act="opencat" data-id="${esc(c.id)}" aria-label="See ${esc(c.name)} spending">
    <span class="tint">${glyph(c)}</span>
    <span class="name">${esc(c.name)}</span><strong class="catamt">${money(spent, 2)}</strong>
    <span class="sub">${spent ? Math.round(share) + "% of this month's spending" : "Nothing yet"}</span><span class="chev" aria-hidden="true">›</span>
    <span class="bar"><i style="width:${share}%"></i></span>
  </button>`;
}

function txRow(t, withDelete) {
  const c = t.kind === "income" ? { name: "Income", t: 0 } : catOf(t.cat);
  const armed = S.armed === "tx:" + t.id;
  return `<div class="tx" style="${tvar(c)}" data-act="opentx" data-id="${esc(t.id)}" role="button" tabindex="0" aria-label="${esc(t.desc || c.name)}, ${money(t.amount, 2)}. Open details">
    <div class="tint" style="grid-row:auto">${t.kind === "income" ? svgIcon("income") : glyph(c)}</div>
    <div style="min-width:0"><div class="name">${esc(t.desc || c.name)}</div>
      <div class="sub">${esc(c.name)} · ${niceDate(t.date)}${t.card ? " · " + esc(cardOf(t.card).name) : ""}${(t.tags || []).map(g => ` <span class="tag">${esc(tagOf(g).name)}</span>`).join("")}${t.example ? ` <span class="tag">Example</span>` : ""}</div>${t.note ? `<div class="note-line">${svgIcon("note", 13)}<span>${esc(t.note)}</span></div>` : ""}</div>
    <div class="amt ${t.kind === "income" ? "in" : ""}">${t.kind === "income" ? "+" : ""}${money(t.amount, 2)}
      ${t.cb ? `<span class="cb">${money(t.cb, 2)} back</span>` : ""}
      ${withDelete ? `<button class="del ${armed ? "armed" : ""}" data-act="deltx" data-id="${esc(t.id)}">${armed ? "Tap to delete" : "Delete"}</button>` : ""}</div>
  </div>`;
}

function emptyCard(mi) {
  return `<div class="card empty">
    <strong>Nothing logged for ${esc(mi.label)} yet</strong>
    <p>Tap the + button to add what you spend or earn. Each entry comes off your monthly cap, and the number up top shows what's left.</p>
    <div class="btns"><button class="btn primary" data-act="add">Add an expense</button>
    <button class="btn" data-act="examples">Try with example data</button></div>
  </div>`;
}

function vCategory(d, mi) {
  const tagId = S.catView.startsWith("tag:") ? S.catView.slice(4) : null;
  const c = tagId ? { id: S.catView, name: tagOf(tagId).name, t: 8 } : catOf(S.catView);

  return q.split(/\s+/).every(w => hay.includes(w.replace(/^\$/, "")));
}
function activityList(mi) {

    && (!f.cat || t.cat === f.cat) && (!f.card || (f.card === "none" ? !t.card && t.kind !== "income" : t.card === f.card))

function chartSVG(d, mi) {
  const W = 340, H = 170, L = 44, R = 12, T = 12, B = 24;
  const daily = Array(mi.days + 1).fill(0);
  for (const t of d.txs) if (t.kind !== "income") daily[+t.date.slice(8, 10)] += t.amount;
  const pts = []; let cum = 0;
  for (let i = 1; i <= mi.lastDay; i++) { cum += daily[i]; pts.push([i, cum]); }
  const max = Math.max(d.budget, cum, 1) * 1.08;
  const x = i => L + (i - 1) / Math.max(1, mi.days - 1) * (W - L - R), y = v => T + (1 - v / max) * (H - T - B);
  const line = pts.map(([i, v], k) => (k ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  const area = pts.length ? line + ` L${x(pts.at(-1)[0]).toFixed(1)} ${y(0)} L${x(1)} ${y(0)} Z` : "";
  const end = pts.at(-1);
  const ticks = [0, d.budget].filter((v, i, a) => a.indexOf(v) === i);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative spending against an even budget pace">
    <defs><linearGradient id="ar" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--ink-2)">${money(v, 0)}</text>`).join("")}
    <line x1="${x(1)}" y1="${y(0)}" x2="${x(mi.days)}" y2="${y(d.budget)}" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
    ${area ? `<path d="${area}" fill="url(#ar)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
    ${end ? `<circle cx="${x(end[0])}" cy="${y(end[1])}" r="4.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>` : ""}
    ${[1, 15, mi.days].map(i => `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 1 ? "start" : i === mi.days ? "end" : "middle"}" font-size="10.5" fill="var(--ink-2)">${i === 1 ? new Date(mi.y, mi.mo - 1, 1).toLocaleDateString("en-US", { month: "short" }) + " 1" : i}</text>`).join("")}
  </svg>`;
}

// Savings = cap minus spending, month by month, from the first month you have entries.
function savingsSection() {
  const months = [...new Set(S.txs.map(t => (t.date || "").slice(0, 7)).filter(Boolean))].sort();
  if (!months.length) return "";
  const cur = ym(new Date()), all = [], list = [];
  for (let m = months[0]; m <= cur; m = shiftMonth(m, 1)) all.push(m);
  const from = S.saveFrom && S.saveFrom <= cur ? S.saveFrom : months[0];
  for (const m of all) if (m >= from) list.push(m);
  const rows = list.map(m => { const dm = derive(m); return { m, spent: dm.spent, cap: dm.budget, custom: (S.capByMonth || {})[m] != null, saved: dm.budget - dm.spent, open: m === cur }; });
  const closed = rows.filter(r => !r.open), total = closed.reduce((a, r) => a + r.saved, 0);
  const max = Math.max(...rows.map(r => Math.abs(r.saved)), 1);
  return `<section class="sec"><div class="sec-h"><h2>Savings</h2>
      <label class="hintp countfrom">Count from <select class="field fsel" id="saveFrom" data-edit="savefrom">${all.map(m => `<option value="${m}" ${m === from ? "selected" : ""}>${esc(monthInfo(m).label)}</option>`).join("")}</select></label></div>

      <strong class="${r.saved < 0 ? "neg" : "pos"}">${r.saved < 0 ? "−" : ""}${money(Math.abs(r.saved), 2)}</strong>
      <span class="sub">${r.saved < 0 ? "Overspent" : r.open ? "Left so far" : "Saved"} · spent ${money(r.spent, 2)} of ${money(r.cap, 0)}${r.custom ? " (custom cap)" : ""}</span>

}

/* ---------- accounts ---------- */
const ATYPES = {
  checking: { label: "Checking", group: "Cash", t: 1 }, savings: { label: "Savings", group: "Cash", t: 0 },
  brokerage: { label: "Brokerage", group: "Investments", t: 3 }, retirement: { label: "Retirement", group: "Investments", t: 5 },
  other: { label: "Other", group: "Other", t: 7 },
};
const DEFAULT_ACCTS = [
  { id: "brokerage", name: "Brokerage", type: "brokerage", history: [] },
  { id: "checking", name: "Checking", type: "checking", history: [] },
  { id: "savings", name: "Savings", type: "savings", history: [] },
];
function exampleAccts() {
  const d = n => { const x = new Date(); x.setDate(x.getDate() - n); return ym(x) + "-" + String(x.getDate()).padStart(2, "0"); };
  return [
    { id: "brokerage", name: "Brokerage", type: "brokerage", history: [{ d: d(60), b: 4100 }, { d: d(30), b: 4385.2 }, { d: d(2), b: 4620.55 }] },
    { id: "checking", name: "Checking", type: "checking", history: [{ d: d(60), b: 1520 }, { d: d(30), b: 1210.4 }, { d: d(2), b: 980.12 }] },
    { id: "savings", name: "Savings", type: "savings", history: [{ d: d(60), b: 2000 }, { d: d(30), b: 2150 }, { d: d(2), b: 2300 }] },
  ];
}
function accts() { return S.accts || DEFAULT_ACCTS; }
function atype(a) { return ATYPES[a.type] || ATYPES.other; }
function bal(a) { return a.history?.length ? a.history.at(-1).b : null; }
function shortDate(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric", ...(y !== new Date().getFullYear() ? { year: "numeric" } : {}) }); }
// Bank accounts switched out of "Cash you can use" (an emergency fund, say) count as Set aside.
function groupOf(a) { return a.reserve && atype(a).group === "Cash" ? "Set aside" : atype(a).group; }
function groupTotals() {
  const g = {};
  for (const a of accts()) { const b = bal(a), k = groupOf(a); if (b != null) g[k] = (g[k] || 0) + b; }
  return g;
}
const GROUP_COLOR = { Cash: "#E6EAF1", "Set aside": "#C9B48A", Investments: "#7F8AA0", Other: "rgba(255,255,255,.3)" };
function isInvest(a) { return atype(a).group === "Investments"; }
function putIn(a) { return (a.flows || []).reduce((s, f) => s + f.amt, 0); }
function daysSince(iso) { const [y, m, d] = iso.split("-").map(Number); return Math.floor((new Date() - new Date(y, m - 1, d)) / 864e5); }
// Investment charts keep one point per month (the last value entered that month) so daily swings don't dominate.
function monthly(h) { const m = {}; for (const x of h) m[x.d.slice(0, 7)] = x; return Object.values(m); }
function renderAcctHero() {
  const g = groupTotals(), any = Object.keys(g).length, cash = g.Cash || 0, aside = g["Set aside"] || 0, inv = g.Investments || 0, other = g.Other || 0;
  const owed = owedTotal(), after = cash - owed, asideNames = accts().filter(a => groupOf(a) === "Set aside").map(a => a.name).join(", ");
  document.getElementById("acctBig").textContent = any ? money(cash, 2) : "—";

function csvCell(v) { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
async function downloadCSV(list, base) {

  const head = ["Date", "Type", "Description", "Category", "Tags", "Card", "Amount", "Cashback", "Cashback rate %", "Notes"];
  const rows = [...list].sort((a, b) => a.date.localeCompare(b.date) || (a.at || 0) - (b.at || 0)).map(t => [
    t.date, t.kind === "income" ? "Income" : "Expense", t.desc || "", t.kind === "income" ? "" : catOf(t.cat).name,
    (t.tags || []).map(g => tagOf(g).name).join("; "), t.card ? cardOf(t.card).name : (t.kind === "income" ? "" : "Cash or debit"),
    t.amount.toFixed(2), t.cb ? t.cb.toFixed(2) : "", t.rate ?? "", t.note || ""]);
  const csv = [head, ...rows].map(r => r.map(csvCell).join(",")).join("\r\n");
  const name = `${base}-${todayISO()}.csv`, file = new File(["\ufeff" + csv], name, { type: "text/csv" });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("Download ready");
}

  let loaded = false, saveT = null;
  try { const c = JSON.parse(localStorage.getItem(key) || "null"); if (c) for (const [k, v] of Object.entries(c)) cache.set(k, v); } catch {}
  const persist = () => { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(key, JSON.stringify(Object.fromEntries(cache))); } catch {} }, 400); };
  const emit = () => { persist(); for (const f of subs) f(null); };
  const fail = e => ({ code: "unavailable", message: e?.message || String(e) });
  async function loadAll() {
    const rows = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await sb.from("docs").select("path,data").range(from, from + 999);
      if (error) throw fail(error);
      rows.push(...data); if (data.length < 1000) break;
    }
    cache.clear(); for (const r of rows) cache.set(r.path, r.data); loaded = true; emit();
  }
  sb.channel("docs-" + uid)
    .on("postgres_changes", { event: "*", schema: "public", table: "docs", filter: "user_id=eq." + uid }, p => {
      if (p.eventType === "DELETE") { if (p.old?.user_id && p.old.user_id !== uid) return; if (p.old?.path) cache.delete(p.old.path); }
      else if (p.new?.user_id === uid) cache.set(p.new.path, p.new.data);
      emit();
    })
    .subscribe(status => { if (status === "SUBSCRIBED" && loaded) loadAll().catch(() => {}); });
  loadAll().catch(e => { for (const f of subs) f(e); });
  addEventListener("online", () => loadAll().catch(() => {}));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) loadAll().catch(() => {}); });
  const doc = path => ({
    async set(data) {
      cache.set(path, data); emit();
      const { error } = await sb.from("docs").upsert({ user_id: uid, path, data, updated_at: new Date().toISOString() });
      if (error) throw fail(error);
    },
    async delete() {
      cache.delete(path); emit();
      const { error } = await sb.from("docs").delete().eq("path", path);
      if (error) throw fail(error);
    },
    onSnapshot(next, err) {
      const f = e => e ? err?.(e) : next({ exists: cache.has(path), data: () => cache.get(path), metadata: { fromCache: !loaded } });
      subs.add(f); if (loaded || cache.size) f(null); return () => subs.delete(f);
    },
  });
  const collection = name => ({
    doc: id => doc(name + "/" + id),
    async add(data) { const id = rid() + rid(); await doc(name + "/" + id).set(data); return { id }; },
    onSnapshot(next, err) {
      const f = e => e ? err?.(e) : next({ docs: [...cache.keys()].filter(k => k.startsWith(name + "/")).map(k => ({ id: k.slice(name.length + 1), data: () => cache.get(k) })), metadata: { fromCache: !loaded } });
      subs.add(f); if (loaded || cache.size) f(null); return () => subs.delete(f);
    },
  });
  // One-time move of data exported from the Claude version: {budget, accounts, tx: {id: entry}}
  async function importAll(obj) {
    const rows = [];
    if (obj.budget) rows.push({ path: "budget", data: obj.budget });
    if (obj.accounts) rows.push({ path: "accounts", data: obj.accounts });
    for (const [id, t] of Object.entries(obj.tx || {})) rows.push({ path: "tx/" + id, data: t });
    for (let i = 0; i < rows.length; i += 400) {
      const { error } = await sb.from("docs").upsert(rows.slice(i, i + 400).map(r => ({ user_id: uid, ...r, updated_at: new Date().toISOString() })));
      if (error) throw fail(error);
    }
    await loadAll();
    return rows.length;
  }
  return { doc, collection, importAll };
}

function startPreview() {
  S.mode = "preview"; S.cats = DEFAULT_CATS.map(c => ({ ...c })); S.cards = DEFAULT_CARDS.map(c => ({ ...c })); store = previewStore();
  S.accts = exampleAccts(); S.txs = exampleTxs(S.month).map(t => ({ id: rid(), ...t })); render();
}

function startLive(user) {
  S.userEmail = user.email || ""; S.mode = "loading"; S.txs = []; S.accts = null; S.cats = null; render();
  const st = makeSbStore(user.id);
  liveStoreRef = st;
  const ref = st.doc("budget"), col = st.collection("tx"), acctRef = st.doc("accounts");
  store = liveStore(ref, col, acctRef);
  acctRef.onSnapshot(s => { const v = s.exists ? s.data() : {}; S.accts = Array.isArray(v.list) ? v.list : DEFAULT_ACCTS; S.cardAccts = v.cardAccts && typeof v.cardAccts === "object" ? v.cardAccts : {}; S.ccOrder = Array.isArray(v.ccOrder) ? v.ccOrder : null; S.ccSince = typeof v.ccSince === "number" ? v.ccSince : null; render(); }, () => { if (!S.accts) S.accts = DEFAULT_ACCTS; render(); });
  const timer = setTimeout(() => { S.stale = true; if (!S.cats) S.cats = DEFAULT_CATS; S.mode = "live"; render(); }, 10000);
  const settle = snap => { if (!snap.metadata.fromCache) { clearTimeout(timer); S.stale = false; } };
  const fail = () => { clearTimeout(timer); S.stale = true; S.mode = "live"; if (!S.cats) S.cats = DEFAULT_CATS; render(); };
  ref.onSnapshot(s => {
    const v = s.exists ? s.data() : {};
    S.cats = Array.isArray(v.categories) ? v.categories : DEFAULT_CATS;
    S.cards = Array.isArray(v.cards) ? v.cards : DEFAULT_CARDS;
    S.cap = typeof v.cap === "number" ? v.cap : null;
    S.tags = Array.isArray(v.tags) ? v.tags : DEFAULT_TAGS;
    S.catSort = v.catSort === "custom" ? "custom" : "spent";
    S.saveFrom = typeof v.saveFrom === "string" ? v.saveFrom : null;
    S.capByMonth = v.capByMonth && typeof v.capByMonth === "object" ? v.capByMonth : {};
    S.motion = v.motion === "system" ? "system" : "always";
    S.mode = "live"; settle(s); render();
  }, fail);
  col.onSnapshot(q => { S.txs = q.docs.map(d => ({ id: d.id, ...d.data() })); settle(q); render(); }, fail);
}

/* ---------- sign-in: email + password (stays inside a home-screen app; iPhone can save it in Keychain) ---------- */
function showAuth(step = "signin", email = "", msg = "", note = "") {
  const root = document.getElementById("authRoot");
  const titles = { signin: "Sign in to Pocket", signup: "Create your Pocket account", reset: "Reset your password", newpass: "Choose a new password" };
  root.innerHTML = `<div class="auth"><form class="auth-card" id="authForm" data-step="${step}">
    <img src="icons/icon-192.png" alt="" width="64" height="64">
    <h2>${titles[step]}</h2>
    <p>${note ? esc(note) : step === "signin" ? "Your data syncs between your iPhone and computer." : step === "signup" ? "Use any email and a password of at least 8 characters." : step === "reset" ? "We'll email you a link to set a new password." : "Enter a new password for your account."}</p>
    ${step !== "newpass" ? `<input class="field" id="authEmail" name="email" type="email" inputmode="email" autocomplete="${step === "signup" ? "email" : "username"}" placeholder="you@example.com" value="${esc(email)}" required>` : ""}
    ${step !== "reset" ? `<input class="field" id="authPass" name="password" type="password" autocomplete="${step === "signin" ? "current-password" : "new-password"}" placeholder="Password" minlength="${step === "signin" ? 1 : 8}" required>` : ""}
    <div class="err">${esc(msg)}</div>
    <button class="btn primary" type="submit">${{ signin: "Sign in", signup: "Create account", reset: "Send reset link", newpass: "Save password" }[step]}</button>
    ${step === "signin" ? `<div class="auth-links"><button class="link" type="button" data-act="authstep" data-id="signup">Create account</button><button class="link" type="button" data-act="authstep" data-id="reset">Forgot password?</button></div>
      <button class="link quiet" type="button" data-act="authclose">Just look around</button>`
      : step !== "newpass" ? `<button class="link" type="button" data-act="authstep" data-id="signin">Back to sign in</button>` : ""}
  </form></div>`;
  setTimeout(() => document.getElementById(step === "newpass" ? "authPass" : "authEmail")?.focus(), 50);
}
function hideAuth() { document.getElementById("authRoot").innerHTML = ""; }
document.addEventListener("submit", async e => {
  if (e.target.id !== "authForm") return;
  e.preventDefault(); e.stopImmediatePropagation();
  const f = e.target, step = f.dataset.step, btn = f.querySelector('button[type="submit"]'); btn.disabled = true;
  const email = document.getElementById("authEmail")?.value.trim() || "", password = document.getElementById("authPass")?.value || "";
  try {
    if (step === "signin") {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      hideAuth(); startLive(data.user); toast("Signed in");
    } else if (step === "signup") {
      const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
      if (error) throw error;
      if (data.session) { hideAuth(); startLive(data.user); toast("Account created"); }
      else showAuth("signin", email, "", "Check your email and tap the confirmation link, then sign in here.");
    } else if (step === "reset") {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      if (error) throw error;
      showAuth("signin", email, "", "If that email has an account, a reset link is on its way. Open it, set a new password, then sign in.");
    } else if (step === "newpass") {
      const { data, error } = await sb.auth.updateUser({ password });
      if (error) throw error;
      hideAuth(); startLive(data.user); toast("Password updated");
    }
  } catch (err) {
    showAuth(step, email, err.message || "Something went wrong. Try again.");
  }
}, true);
document.addEventListener("click", async e => {
  const a = e.target.closest("[data-act]")?.dataset.act;
  if (a === "signin") { if (sb) showAuth(); else toast("Add your Supabase details to config.js first"); }
  else if (a === "authclose") hideAuth();
  else if (a === "authstep") showAuth(e.target.closest("[data-act]").dataset.id, document.getElementById("authEmail")?.value || "");
  else if (a === "signout") { await sb?.auth.signOut(); try { for (const k of Object.keys(localStorage)) if (k.startsWith("pocket-cache-")) localStorage.removeItem(k); } catch {} location.reload(); }
});
document.addEventListener("change", async e => {
  if (e.target.id !== "importFile" || !e.target.files?.[0]) return;
  try {
    const obj = JSON.parse(await e.target.files[0].text());
    if (obj.format !== "pocket-export-1") return toast("That isn't a Pocket export file");
    const n = Object.keys(obj.tx || {}).length;
    if (!confirm(`Import ${n} transactions plus your settings, cards and accounts? Anything with the same ID is replaced.`)) return;
    await liveStoreRef.importAll(obj); toast(`Imported ${n} transactions`);
  } catch (err) { toast("Couldn't import: " + (err.message || "unreadable file")); }
  finally { e.target.value = ""; }
});

async function init() {
  render();
  const cfg = window.POCKET_CONFIG || {};
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase) return startPreview();
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  // Opening a password-reset link signs you in briefly so you can pick a new password.
  sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") showAuth("newpass"); });
  const { data } = await sb.auth.getSession();
  if (location.hash.includes("type=recovery")) { if (!data.session) startPreview(); return; }
  if (data.session) startLive(data.session.user);
  else { startPreview(); showAuth(); }
}
init();
</script>
